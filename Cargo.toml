[package]
name = "cdecl-to-rsdecl"
version = "0.3.0"
edition = "2021"

authors = ["A4-Tacks <wdsjxhno1001@163.com>"]
keywords = ["cdecl", "c", "declare"]
description = "Convert some C declaration into Rust style declaration"

license = "MIT"
repository = "https://github.com/A4-Tacks/cdecl-to-rsdecl"
readme = "README.md"

[features]
trace = ["peg/trace"]

[profile.release]
strip = true

[dependencies]
atty = "0.2.14"
char-classes = "0.2.5"
either = "1.15.0"
getopts-macro = "0.1.5"
peg = "0.8.5"
rustyline = { version = "19.0.0", default-features = false }

[dev-dependencies]
test-buffer = { version = "0.2.0", features = ["expect-test"] }
